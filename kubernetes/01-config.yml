apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: bell-streaming
data:
  # Node.js Services
  VIDEO_METADATA_SERVICE_URL: "http://video-metadata-service:3002"
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  BCRYPT_SALT_ROUNDS: "10"
  DEFAULT_THUMBNAIL_URL: ""
  S3_VIDEO_KEY_PREFIX: "videos"
  S3_ENDPOINT: ""
  S3_FORCE_PATH_STYLE: "false"
  S3_PUBLIC_BASE_URL: ""
  S3_PUBLIC_ENDPOINT: ""
  ALLOWED_VIDEO_EXTENSIONS: ".mp4,.mov,.avi,.webm,.mkv,.mpeg,.mpg"
  ALLOWED_VIDEO_TYPES: "video/mp4,video/mpeg,video/quicktime,video/x-msvideo,video/webm,video/x-matroska"
  MAX_FILE_SIZE_MB: "500"
  S3_PRESIGNED_URL_EXPIRATION: "900"
  UPLOAD_TIMEOUT_MS: "1800000"
  UPLOAD_MONITOR_INTERVAL_MS: "300000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: bell-streaming
type: Opaque
stringData:
  # Replace with your actual secrets, preferably managed by a secret manager like AWS Secrets Manager or HashiCorp Vault
  MONGODB_URI: "mongodb://your-mongo-db-uri"
  JWT_SECRET: "your-super-secret-jwt-key"
  JWT_REFRESH_SECRET: "your-super-secret-refresh-key"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_KEY"
  S3_BUCKET_NAME: "your-s3-bucket-name"
